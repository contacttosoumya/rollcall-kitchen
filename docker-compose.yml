version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rollcall_kitchen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - rollcall_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "true"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: rollcall_kitchen
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_POOL_MAX: 20
    ports:
      - "3000:3000"
    # Run migrations + seed once, then start the server. Safe to re-run on
    # every container start since both scripts are idempotent.
    command: sh -c "npm run db:setup && node server.js"

volumes:
  rollcall_pgdata:
